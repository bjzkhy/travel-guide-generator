<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>{{TITLE}}</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  img { max-width: 100%; height: auto; display: block; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #eef4fb; color: #1e293b; line-height: 1.7;
    padding: 24px 12px 60px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  header {
    position: relative;
    background-image: linear-gradient(rgba(3,105,161,.78), rgba(3,105,161,.62)), url('{{HEADER_BG}}');
    background-size: cover; background-position: center;
    color: #fff; border-radius: 18px; padding: 30px 28px; margin-bottom: 22px;
    box-shadow: 0 10px 30px rgba(3,105,161,.28);
  }
  header h1 { font-size: 27px; letter-spacing: .5px; text-shadow: 0 2px 8px rgba(0,0,0,.35); }
  header .sub { margin-top: 8px; font-size: 14px; opacity: .96; text-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .tabs { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
  .tabs span {
    background: rgba(255,255,255,.2); padding: 5px 13px; border-radius: 20px;
    font-size: 13px; backdrop-filter: blur(4px);
  }
  .tabs span.hl { background: #fff; color: #0369a1; font-weight: 700; }
  section {
    background: #fff; border-radius: 16px; padding: 22px 24px; margin-bottom: 18px;
    box-shadow: 0 4px 18px rgba(15,23,42,.06);
  }
  h2 { font-size: 19px; color: #0369a1; border-left: 5px solid #fb7185; padding-left: 12px; margin-bottom: 18px; }
  .route-line { background:#f0f9ff; border:1px solid #bae6fd; border-radius:10px; padding:12px 16px; font-size:14.5px; font-weight:700; color:#0c4a6e; line-height:1.8; margin-bottom:12px; }
  .route-line .seg { display:inline-block; margin:2px 4px; }
  .districts { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
  .districts span { font-size:13px; background:#e0f2fe; color:#0369a1; padding:3px 11px; border-radius:999px; }
  /* 整体路线图：节点-连线可视化 */
  .rt-flow { display:flex; align-items:flex-start; justify-content:space-between; gap:4px; margin:6px 0 14px; flex-wrap:nowrap; }
  .rt-node { width:96px; flex:0 0 96px; text-align:center; }
  .rt-ring { width:78px; height:78px; margin:0 auto; border-radius:50%; overflow:hidden; border:3px solid #7dd3fc; box-shadow:0 3px 10px rgba(56,189,248,.22); background:#e0f2fe; }
  .rt-ring.hz { border-color:#10b981; box-shadow:0 3px 10px rgba(16,185,129,.22); background:#d1fae5; }
  .rt-ring img { width:100%; height:100%; object-fit:cover; display:block; }
  .rt-city { font-size:14px; font-weight:700; color:#0f172a; margin-top:8px; }
  .rt-code { font-size:11px; color:#94a3b8; letter-spacing:1px; }
  .rt-when { font-size:11.5px; color:#64748b; margin-top:2px; }
  .rt-link { flex:1; min-width:36px; padding-top:26px; text-align:center; }
  .rt-line { height:3px; border-radius:2px; background:linear-gradient(90deg,#7dd3fc,#38bdf8); position:relative; }
  .rt-line.hz { background:linear-gradient(90deg,#38bdf8,#34d399); }
  .rt-line.back { background:linear-gradient(90deg,#34d399,#7dd3fc); }
  .rt-mode { font-size:12px; color:#0369a1; font-weight:600; margin-top:6px; white-space:nowrap; }
  .rt-dur { font-size:11px; color:#94a3b8; }
  .rt-ticket { display:inline-block; font-size:10.5px; font-weight:700; color:#15803d; background:#dcfce7; border:1px solid #bbf7d0; border-radius:6px; padding:1px 7px; margin-top:5px; white-space:nowrap; }
  .rt-stat { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; background:#f1f7fd; border:1px solid #e0eefb; border-radius:12px; padding:12px 14px; margin-top:6px; }
  .rt-stat > div { text-align:center; }
  .rt-stat b { display:block; font-size:17px; color:#0c4a6e; }
  .rt-stat span { font-size:11.5px; color:#64748b; }
  .note { font-size: 13px; color: #64748b; margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
  th, td { border: 1px solid #e2eaf2; padding: 9px 11px; text-align: left; vertical-align: top; }
  th { background: #f0f9ff; color: #0369a1; font-weight: 600; }
  a { color: #0284c7; }
  /* Timeline */
  .timeline { margin-bottom: 16px; }
  .timeline:last-child { margin-bottom: 0; }
  .tl-item { display: block; margin-bottom: 18px; }
  .tl-item:last-child { margin-bottom: 0; }
  .tl-item .time {
    display: inline-block; background: #e0f2fe; color: #0369a1;
    font-size: 12.5px; font-weight: 700; padding: 3px 12px; border-radius: 999px;
    margin-bottom: 8px; white-space: nowrap;
  }
  .tl-item .dot { display: none; }
  .tl-item > img { width: 100%; height: 240px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; }
  @media (max-width: 680px) { .tl-item > img { height: 180px; } }
  .tl-card {
    display: block; background: #fff; border-radius: 14px;
    padding: 15px 17px; border: 1px solid #e2eaf2; box-shadow: 0 2px 10px rgba(15,23,42,.04);
  }
  .tl-card img {
    width: 100%; height: 240px; object-fit: cover; border-radius: 10px; margin-bottom: 10px;
  }
  .tl-card .t { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-weight: 700; font-size: 15.5px; line-height: 1.45; color: #0f172a; }
  .tl-card .d { font-size: 14px; line-height: 1.6; color: #334155; margin-top: 6px; }
  .tl-card .price { color: #e8590c; font-weight: 700; }
  .tl-card .booking { display:inline-block; margin-top:9px; background:#fff7ed; border:1px solid #fed7aa; color:#c2410c; font-size:12.5px; font-weight:600; padding:4px 10px; border-radius:8px; }
  .tl-card .booking::before { content:"📌 "; }
  .tag {
    display: inline-block; background: #e0f2fe; color: #0369a1; font-size: 12px;
    padding: 1px 8px; border-radius: 6px; margin-top: 5px; font-weight: 600;
  }
  .city-badge {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px;
    border-radius: 6px; margin-left: 8px; color: #fff;
  }
  .city-sh { background: #0284c7; }
  .city-hz { background: #10b981; }
  .city-back { background: #f59e0b; }
  .city-hk { background: #e11d48; }
  .city-mo { background: #0d9488; }
  .day-title {
    display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 10px;
    font-size: 16.5px; font-weight: 800; color: #0c4a6e; margin: 28px 0 16px;
    padding: 12px 16px; background: linear-gradient(90deg, #e0f2fe, #f0f9ff);
    border: 1px solid #bae6fd; border-left: 4px solid #0284c7; border-radius: 12px; line-height: 1.4;
  }
  .day-title .weather {
    font-size: 13.5px; font-weight: 700; color: #0369a1;
    background: #e0f2fe; border: 1px solid #bae6fd; border-radius: 999px;
    padding: 2px 11px 2px 9px; white-space: nowrap;
  }
  .tips-block { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:4px 18px 14px; margin-top:6px; }
  .tips-block h3 { font-size:14.5px; font-weight:800; color:#0e7c86; margin:16px 0 8px; }
  .tips-block ul { margin:0; padding-left:20px; }
  .tips-block li { font-size:13.5px; color:#334155; margin:5px 0; line-height:1.5; }
  .food h3 { font-size:14.5px; font-weight:800; color:#0e7c86; margin:18px 0 8px; }
  /* Recommendation cards (Ctrip) */
  .rec-sub { font-size:15px; font-weight:800; color:#0e7c86; margin:20px 0 10px; }
  .rec-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:6px; }
  .rec-card { background:#fff; border:1px solid #e2eaf2; border-radius:14px; padding:14px 16px; box-shadow:0 2px 10px rgba(15,23,42,.04); }
  .rec-card .rec-date { display:inline-block; font-size:12.5px; font-weight:700; color:#0369a1; background:#e0f2fe; border:1px solid #bae6fd; border-radius:8px; padding:3px 11px; margin-bottom:9px; }
  .rec-card .route { font-weight:800; font-size:15px; color:#0f172a; display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
  .rec-card .meta { font-size:13px; color:#334155; margin-top:8px; line-height:1.65; }
  .rec-card .meta b { color:#0f172a; }
  .badge-ok { background:#dcfce7; color:#15803d; font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:6px; white-space:nowrap; }
  .badge-alt { background:#f1f5f9; color:#64748b; font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:6px; white-space:nowrap; }
  .badge-pending { background:#fef9c3; color:#a16207; font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:6px; white-space:nowrap; }
  .ctrip-btn { display:inline-block; margin-top:11px; background:#ff7700; color:#fff; padding:7px 14px; border-radius:8px; font-weight:700; font-size:13px; text-decoration:none; }
  .ctrip-btn:hover { background:#e96c00; }
  @media (max-width:680px){ .rec-grid { grid-template-columns:1fr; } }
  .tip {
    background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px;
    padding: 13px 15px; font-size: 13.5px; color: #9a3412; margin-top: 18px;
  }
  .summary { display: flex; flex-wrap: wrap; gap: 14px; }
  .summary .card {
    flex: 1 1 200px; background: #f0f9ff; border: 1px solid #bae6fd;
    border-radius: 12px; overflow: hidden; font-size: 13.5px; color: #0c4a6e;
  }
  .summary .card .card-img { width: 100%; height: 160px; object-fit: cover; display: block; }
  .summary .card .ci { padding: 10px 13px 12px; }
  .summary .card .e { font-size: 18px; }
  .summary .card .c { font-weight: 700; margin: 3px 0 2px; }
  footer { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 8px; }
  @media (max-width: 680px) {
    .tl-card img { height: 180px; }
    .rt-flow { flex-wrap:wrap; justify-content:center; gap:8px; }
    .rt-node { width:70px; flex:0 0 70px; }
    .rt-ring { width:58px; height:58px; border-width:2px; }
    .rt-link { flex:0 0 44px; min-width:44px; padding-top:18px; }
    .rt-mode { font-size:11px; }
    .rt-stat { grid-template-columns:repeat(2,1fr); }
  }
  .rec-card .rec-img { display:block; width:100%; height:160px; object-fit:cover; border-radius:10px; margin-bottom:11px; }
  @media (max-width:680px){ .rec-card .rec-img { height:140px; } }
  /* 初稿待确认横幅 */
  .draft-banner { background:#fffbeb; border:1px solid #fde68a; color:#92400e; border-radius:14px; padding:13px 18px; margin-bottom:18px; font-size:14px; font-weight:600; text-align:center; box-shadow:0 4px 18px rgba(15,23,42,.06); }
  /* 美食购物：每项一卡（上图下文） */
  .food-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:10px 0 18px; }
  .food-card { border:1px solid #eee; border-radius:12px; overflow:hidden; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.06); transition:transform .15s,box-shadow .15s; }
  .food-card:hover { transform:translateY(-3px); box-shadow:0 6px 16px rgba(0,0,0,.12); }
  .food-card img { width:100%; height:150px; object-fit:cover; display:block; background:#f2f2f2; }
  .food-body { padding:9px 11px 12px; }
  .food-body .fn { font-size:15px; font-weight:700; color:#222; margin-bottom:3px; }
  .food-body .fd { font-size:12.5px; color:#666; line-height:1.5; }
  @media (max-width:560px){ .food-grid { grid-template-columns:1fr; } .food-card img { height:160px; } }
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>{{TITLE}}</h1>
<div class="sub">{{SUB}}</div>
<div class="sub" style="font-size:12px;color:#475569;margin-top:4px;text-shadow:0 1px 3px rgba(0,0,0,.35);">{{WEATHER_NOTE}}</div>
<div class="tabs">{{TABS}}</div>
</header>
{{DRAFT}}
{{ROUTE_SECTION}}
{{TRANSPORT_SECTION}}
{{HOTELS_SECTION}}
{{BUDGET_SECTION}}
{{TIMELINE_SECTION}}
{{HIGHLIGHTS_SECTION}}
{{FOOD_SECTION}}
{{TIPS_SECTION}}

<footer>{{FOOTER}}</footer>
</div>
</body>
</html>
