tips:
  kids:
    - "证件：护照有效期需6个月以上；中国大陆赴首尔一般需签证，务必提前办妥(济州才免签)"
    - "通讯：租韩游WiFi蛋/雪花卡或开通国际漫游；给孩子备电话手表/定位"
    - "交通：买T-money卡(地铁公交通用)，仁川机场AREX直通明洞最方便"
    - "9岁儿子：乐天世界部分项目有身高限制，提前确认；备常用药"
    - "13岁女儿：明洞/弘大美妆逛街兴趣高，给预算让她自主选购"
    - "行李：薄外套/卫衣(10月早晚15℃左右)、折叠伞、水壶、零食；每天留午休"
  booking:
    - "乐天世界/首尔塔可提前网购优惠票"
    - "景福宫穿韩服免费入场(可现场租赁)"
    - "免税店提前官网/APP下单，机场提货更划算"
    - "明洞热门餐厅可提前取号，避开饭点高峰"
  pitfalls:
    - "换钱：明洞换钱所汇率优于机场，机场先换少量应急"
    - "免税店：部分需机场提货，别在市区拿错；保留护照+小票退税"
    - "出租车：黑色模范出租车贵，用Kakao T/网约车；认准橙色/银色普通出租"
    - "谨防明洞'免费皮肤测试'拉客，理性消费"
    - "满额退税：免税店当场退或机场退，保留所有小票"

