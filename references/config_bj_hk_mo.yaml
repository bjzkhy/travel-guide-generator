# 实用贴士
tips:
  kids:
    - "证件：港澳通行证 + 有效香港/澳门签注，必须提前办理（护照不能代替）"
    - "通讯：提前开手机境外流量包/漫游，或到港买本地SIM；下载离线地图"
    - "货币：备小额港币、澳门币现金；大额用银联/支付宝/微信，澳门元港币基本通用"
    - "插头：英标G型转换插头(香港/澳门同款)，带拖线板更方便"
    - "随身：折叠伞(防骤雨)、防晒霜、薄外套(室内冷气足)、舒适步行鞋"
    - "给孩子备旅行手账，每天画/贴一张，旅行更有记忆点"
  booking:
    - "香港迪士尼：官网或携程提前购票，比现场便宜"
    - "澳门旅游塔、威尼斯人表演：官网提前订，旺季现场常满"
    - "酒店：8月为暑期旺季，尽早预订香港/澳门住宿"
    - "香港机场快线：网上买有折扣，可连同市区交通票套票"
  heat:
    - "8月高温高湿(28-34℃)，多补水、勤涂防晒"
    - "午后易雷阵雨，随身雨具；室外景点尽量早上去"
    - "室内冷气强，备薄外套防感冒"
    - "台风高发期，出发前关注香港/澳门天文台预警，预留改签余地"
  pitfalls:
    - "香港的士贵且难叫，优先港铁/叮叮车/巴士；澳门用免费穿梭巴士(Hotel Shuttle)最划算"
    - "澳门赌场内「换钱党」勿理，用正规找换店/银行ATM"
    - "大三巴周边手信认准钜记/咀香园，部分可讲价"
    - "香港大部分餐厅加收10%服务费；澳门部分娱乐场所未满21岁禁入"
    - "澳门元与港币基本1:1通用，但找零可能给澳门元，留意区分"

