# 实用贴士
tips:
  kids:
    - "行李：折叠推车（9岁可坐可放物）、防晒衣、小风扇、水壶、防走失手环"
    - "9岁儿子部分项目需注意年龄/身高（宋城演出、灵隐台阶），提前确认政策"
    - "13岁女儿可玩刺激项目，安排她带弟弟排队互动，培养责任感"
    - "每天留午休时间，避免孩子中暑崩溃"
    - "备常用药：退烧、肠胃、创可贴、驱蚊液；随身小零食应对排队饥饿"
    - "给孩子备一本旅行手账，每天画/贴一张，旅行更有记忆点"
  booking:
    - "上海自然博物馆：提前公众号预约，16:00前入场"
    - "上海海洋水族馆：可提前网购优惠票，避开高峰时段"
    - "宋城千古情：提前买票选场次"
    - "杭州野生动物世界：可提前网购优惠票"
  heat:
    - "高温35°C+，户外景点尽量早上去"
    - "多安排亲水/室内：海洋水族馆、自然博物馆"
    - "随身：遮阳伞、防晒霜、小风扇、充足饮水"
    - "8月可能有阵雨，带轻便雨具"
  pitfalls:
    - "西湖私人游船多为短程绕湖不含登岛，认准官方西湖游船公司"
    - "灵隐寺外香烛店溢价3-5倍，寺内免费三支清香"
    - "河坊街杭州特产多义乌货，去九芝斋等老字号（九芝斋为杭州老字号）"
    - "别在景区吃叫花鸡（多为冷冻鸡+香精），认准楼外楼"
    - "机场/火车站黑车报价比网约车高2-3倍，用滴滴/高德"

