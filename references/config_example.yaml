# ⚠️ 演示数据：以下为示例占位内容，非真实行程，请勿直接用于出行安排。
# ============================================================
# travel-guide-generator 示例配置（沪杭亲子四日游）
# 用法: python scripts/build.py --config references/config_example.yaml --out guide.html --imgdir assets/img
# 图片: 运行前需把下列 img key 对应的图放到 assets/img/{key}.jpg/png
#
# 【信息完整度三态】transport/hotels 每项的 confirmed 字段：
#   true  = 已订/已出票 → 「✅ 确定出行」绿徽章
#   false = 候选(携程查到的未订项) → 「备选」灰徽章
#   省略/null = 未填 → 「⏳ 待确认」黄徽章（框架态）
# 【混合策略默认行为】用户只给 目的地+日期+人数 时：
#   交通 → ctrip-wendao 查候选回填(confirmed:false 标备选)；
#   酒店 → 不联网查，留空 → 自动顶部「初稿」横幅 + 待确认占位卡。
#   (注: meta.draft 未设时，build 会按"酒店留空/交通全候选"自动推断初稿态)
# ============================================================

meta:
  title: "示例·沪杭亲子四日游攻略（演示）"
  depart_city: "天津"
  cities: ["上海", "杭州"]
  start_date: "2026-08-10"
  end_date: "2026-08-13"
  travelers: "一家四口出行（含两名儿童，演示）"
  travel_mode: "飞机往返"
  tabs: ["🏙️ 上海 8/10-11", "🍃 杭州 8/12", "✈️ 返程 8/13"]
  weather_note: "天气为客观预报，临近出发请以实时预报为准"
  header_bg: "header_airplane"
  footer: "本攻略由 travel-guide-generator 生成 · 城际交通与酒店链接跳转携程"

# 各模块开关（按需勾选）
modules:
  transport: true
  hotels: true
  budget: true
  timeline: true
  tips: true
  food: true
  route: true
  highlights: true

# 整体路线图（节点-连线可视化；nodes 顺序即动线，links[i] 接在 nodes[i] 与 nodes[i+1] 之间）
