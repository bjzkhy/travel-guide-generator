# ticketed: 省略时自动取对应 transport[].confirmed(城市对+类型匹配)；显式 true 显示「✅ 已出票」
# line_cls: "" 去程(蓝) / "hz" 高铁(蓝绿) / "back" 返程(绿蓝)；node.accent="hz" 给杭州节点绿色环
route:
  note: "四日动线总图：飞机往返 + 高铁 G1377 复兴号串联"
  nodes:
    - {city: "天津", code: "TSN", when: "8/10 出发", img: "tianjin_landmark"}
    - {city: "上海", code: "SHA", when: "D1–D2 · 2晚", img: "shanghai_landmark"}
    - {city: "杭州", code: "HGH", when: "D3–D4 · 1晚", img: "hangzhou_landmark", accent: "hz"}
    - {city: "天津", code: "TSN", when: "8/13 返程", img: "tianjin_landmark"}
  links:
    - {mode: "✈️", carrier: "国航 CA2839", dur: "08:15→10:45 · 2h30m", ticketed: true, line_cls: ""}
    - {mode: "🚄", carrier: "G1377 复兴号", dur: "09:30→10:25 · 55分钟", ticketed: true, line_cls: "hz"}
    - {mode: "✈️", carrier: "国航 CA2848", dur: "13:15→15:30 · 2h15m", ticketed: true, line_cls: "back"}
  stats:
    - {value: "≈2300 km", label: "飞机+高铁串联"}
    - {value: "4天3晚", label: "8/10 – 8/13"}
    - {value: "2座城", label: "上海 · 杭州"}
    - {value: "14处", label: "亲子打卡点"}

